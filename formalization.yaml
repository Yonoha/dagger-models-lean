# yaml-language-server: $schema=./.ci/schema/formalization-v0.4.schema.json
version: "v0.4"
project:
  name: "Dagger models in Lean"
  description: >-
    A partial formalization of foundational constructions from Models for dagger
    (infinity,1)-categories I. It constructs the reversal simplex category and
    dagger simplicial sets, proves their presheaf equivalence and presentability,
    constructs the actual free-forgetful adjunction and its zero-skeleton pushout
    presentation with the unit and swap dagger, and proves elementary
    reversal and nondegeneracy lemmas, the vertex-level word obstruction,
    the free-versus-normal cofibration obstruction, and the integer dagger
    groupoid example separating ordinary equivalence from unitary essential
    surjectivity. Free cofibrations are proved closed under identities,
    composition, coproducts, pushouts, continuous transfinite composition, and
    retracts. Every free cofibration is an actual relative free-boundary-cell
    complex, and the saturation of those generators equals the original
    free-cofibration class. The construction uses the genuine relative skeletal
    filtration and colimit, individual new vertices in degree zero, and free
    dagger orbits in positive degrees, at arbitrary value universe.
    It also constructs genuine dagger simplicial categories and graphs, the
    actual finite-path free category, and its free-forgetful adjunction with
    singleton-edge unit and full universal property. The graph forgetful functor
    is monadic by constructed graph-split coequalizers and Beck's theorem.
    The graph category has an actual small-index presheaf equivalence, all small
    limits and colimits, and local finite presentability at every value universe.
    The actual finite-word monad is finitary; all small limits and filtered
    colimits exist for dagger simplicial categories and are created over graphs.
    Local finite presentability of dagger simplicial categories remains unproved.
    The main model-categorical theorems A-D are not formalized.
  authors:
    - "Keima Akasaka (AI-assisted; implementation generated with Codex)"
  responsible_maintainers:
    - "Keima Akasaka"
  license: "Apache-2.0"
sources:
  - title: "Models for dagger (infinity,1)-categories I: Dagger simplicial sets and unitary cores"
    authors: ["Keima Akasaka"]
    type: "article"
    location: >-
      def.dagger_simplicial_sets; the index-category definition before
      prop.sSetdag_is_equivalent_to_Fun; dj.def.free-cof; the opening
      nondegeneracy argument in dj.lem.free-cof; the vertex-level obstruction
      in the proof of dj.prop.counterexample; prop.sSetdag_is_equivalent_to_Fun;
      the simplicial-set free-forgetful adjunction in dj.not.adjunctions;
      the explicit predicate obstruction in pointset.cor.cofibrant-obstruction;
      parts (1)-(2) of pointset.prop.weak-counterexample.
      The explicit zero-skeleton pushout in dj.not.adjunctions and the
      full cellular characterization in dj.lem.free-cof are also formalized,
      together with dj.cor.Fdag-free. Every free cofibration has an actual
      relative presentation by free boundary cells, and the stated saturation
      equality is proved.
      It also formalizes bg.def.dagger-scat, bg.def.dagger-graph, and the free
      word construction with its universal property at the start of
      bg.lem.presentable, and the monadicity assertion of that lemma using
      constructed graph-split coequalizers. The graph-LFP ingredient is proved via
      an actual small-index presheaf equivalence. The actual word monad's
      finitarity is proved by exact finite endpoint pullbacks and their disjoint
      sum, naturally identified with the original free functor. The lemma's local finite
      presentability conclusion for dagger simplicial categories is not yet proved.
    relationship: "formalizes"
    author_endorsement: "participated"
    note: >-
      Based on the author's working manuscript inspected on 2026-10-01.
      The author commissioned the project and its public repository.
      This participation does not assert that the author has reviewed the Lean
      statements or independently verified the source-to-Lean correspondence.
related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Uses simplicial sets, opposites, simplex reversal, nondegenerate simplices,
      category equivalences, presentability, Kan extensions, and groupoids.
      The free dagger simplicial-category construction uses actual enriched
      categories and functors, Cartesian SSet tensor, quivers, and finite paths.
status:
  scope: >-
    Partial formalization toward A-D. Presheaf equivalence and local finite
    presentability are proved at every value universe, as is existence of the
    actual free-forgetful adjunction and its explicit free-completion pushout,
    with the genuine universal property, unit and swap dagger. All stated free
    cofibration closure operations are proved. Every free cofibration has an
    actual relative free-boundary-cell presentation, and the stated saturation
    equals the original class, proving both conclusions of dj.lem.free-cof.
    The actual category of dagger simplicial categories, graph category,
    finite-path free construction, free-forgetful adjunction and singleton
    unit are proved. Monadicity of the graph forgetful functor is proved by
    constructing the actual split quotient enrichment, quotient functor and
    coequalizer universal property, followed by Beck's theorem. The graph category
    is proved equivalent to a concrete small-index presheaf category, with all
    small limits/colimits and local finite presentability at each value universe.
    The actual word monad is finitary, with arbitrary graph maps and common
    value universe. Monadicity creates all small limits and filtered colimits
    over graphs, and those colimits and limits exist, with no remaining
    finitarity premise. General colimits, local finite presentability, and the
    different ordinary-category forgetful assertion in bg.lem.creation remain
    unproved for dagger simplicial categories.
    Full simplicial counterexamples, model structures, unitary-core recognition
    and main theorems A-D remain unproved. The
    concrete comparison obstructions do not by themselves establish Theorem D.
  # Counts apply to the DaggerModels library. Trusted Challenge skeletons use
  # intentional proof placeholders and are not imported by the library.
