automation:
  methods:
    - method: "agent"
      models: ["gpt-6-astra"]
      framework: "Codex"
      tool_setup: >-
        Local Lean/Lake proof development with mathlib, GitHub Actions,
        a transitive axiom audit, and leanprover/comparator in a separate
        Linux verification job. No external model-categorical theorem is
        postulated as an axiom to make the proofs pass.
      prompting_notes: >-
        The author requested a Lean companion to Part I and a dedicated GitHub
        repository, then requested Comparator and formalization.yaml support.
        Mathematics in the manuscript must not be silently changed.
    - method: "agent"
      models: ["gpt-6.1-sol"]
      framework: "Codex subagents (xhigh)"
      tool_setup: >-
        Bounded proof implementation from the manuscript, short Challenge
        specifications, and a separate read-only manuscript-correspondence review.
        The lean4 core skill and references
        from cameronfreer/lean4-skills were installed at revision
        b6243b85b9b0a0ddff5bb6773889044daf687f8e and read for this work.
        Lean/Lake and the repository's existing checks supply compiler feedback;
        optional skill helper executables, hooks, and Lean LSP were not installed.
      prompting_notes: >-
        The author requested short, directly reviewable Challenges importing
        only Mathlib, with existing theorem statements and coverage preserved.
        GPT-6.1-Sol with xhigh is the implementation/review default; ultra is
        reserved for identified hard obstacles, and new mathematics is treated
        separately from translating an existing proof. The author subsequently
        requested formalization of the main theorems; MAIN_THEOREMS.md retains
        that complete objective and distinguishes the proved dependencies from
        the still unproved model-categorical conclusions.
  notes: >-
    AI generated the implementation and performed the documented checks.
    The manuscript-to-statement correspondence has been assessed by the agent;
    no independent human mathematical review is claimed.
fidelity:
  divergences: >-
    This is a partial formalization. Fin (n+1) represents the ordinal [n],
    and monotone-or-antitone is a property rather than an orientation tag.
    The dagger simplicial-set involution is expressed degreewise using SSet.opObjEquiv.
    Bool represents the two vertices in the algebraic word obstruction and
    the two objects of the integer dagger groupoid; their simplicial nerve
    and model-categorical consequences are not formalized.
    The definition of FreeCofibration uses Mono in the dagger category.
    The original free functor is constructed via actual left Kan extension.
    A second, explicit pushout construction with swap dagger is proved left
    adjoint to the same forgetful functor and naturally isomorphic to the
    original free functor,
    compatibly with the unit. The canonical common-vertices identification
    uses mathlib skeleton 1, whose generators have dimension less than 1;
    this is exactly the manuscript's sk_0. The pushout, unit and swap are
    proved for every choice of the free adjunction. All category equivalence,
    presentability and free-adjunction results retain arbitrary value universe u.
    Coproduct/transfinite closure uses index types in that value universe.
    The relative filtration is literally image plus mathlib skeleton n,
    corresponding to the manuscript stage B_{le n-1}; its inclusion and colimit
    are fixed by the Challenge. Boundary characteristic maps are not assumed
    monic, and degree zero is included. The full relative-cell presentation
    constructs actual orbit representatives and attachment pushouts: individual
    new vertices in degree zero and free dagger orbits in positive degrees.
    The countable stage order is transported to ULift Nat for saturation at
    arbitrary universe u. The result applies to any actual left adjoint of
    the original forgetful functor, including the canonical free functor.
    The existential Challenge goals do not fix a chosen
    witness implementation; the library supplies the manuscript's concrete
    counterexamples and actual equivalence/adjunction data.
    Dagger simplicial categories use ordinary SSet morphisms on the reversed
    mapping spaces, with enriched identity and composition laws; they do not
    use simplex reversal or a fixed-vertex condition on mapping spaces.
    Their definition has independent object and hom universes. The graph and
    free-category constructions use any common universe u. Actual finite
    paths give the mapping spaces, with empty identity, concatenation, and
    graph dagger applied in reverse word order. No cancellation quotient is
    used. Extension and uniqueness construct the genuine adjunction; its unit
    is proved to be singleton insertion. The short universal Challenge fixes
    bijective restriction on all functors for every target, without fixing
    the free witness. A separate concrete-word Challenge fixes the path
    operations. The graph forgetful functor is proved to reflect isomorphisms.
    Split quotient identities and composition are constructed from the graph
    section and original operations, with endpoint transports. The split
    equations imply preservation by the quotient map; actual lifted tuples
    prove category and dagger laws. The given quotient graph and map are
    definitionally retained. The section is never assumed to preserve operations.
    Graph descent gives the coequalizer universal property and preservation,
    and Beck's theorem gives actual monadicity. Dagger graphs are proved equivalent
    to presheaves on a small index with vertex and simplex-edge objects. The
    dagger involution commutes with ordinary simplex operators. Endpoint fibers
    and total edges give both functors, natural unit/counit and the triangle.
    Local finite presentability of the presheaf category and all small
    limits/colimits transport to the original graph category. The Challenge
    protects this actual equivalence's existence and graph LFP/LP while leaving
    the indexing witness free. Exact finite endpoint pullbacks are naturally
    equivalent to actual paths of each length. Their disjoint sum is naturally
    identified with the original free-category total edges, including arbitrary
    vertex maps. This proves finitarity of the original word composite. The new
    target requires an actual left adjoint to the same graph forgetful functor
    with finitely accessible composite; the original free adjunction witnesses it.
    The graph forgetful functor creates all small limits and filtered colimits,
    which exist, and is itself finitely accessible. General colimits and local
    finite presentability of dagger simplicial categories remain unproved.
    See CORRESPONDENCE.md for the complete scope discussion.
review:
  status: "agent-reviewed"
  reviewers: ["Codex (GPT-6 Astra)", "Codex subagent (GPT-6.1-Sol, xhigh)"]
  notes: >-
    Build, axiom audit, metadata consistency, and Comparator are executable
    checks, not independent human review. Comparator checks 89 selected library
    theorems and three audit-only definition roots against seventeen self-contained
    Challenge files in .ci/comparator. Each imports only Mathlib. The original
    fifteen have 100-line budgets (72, 96, 22, 92, 88, 44, 91, 28, 88, 55, 93, 29,
    73, 100, and 83 lines). The literal monadicity/word-finitarity specification has 160 lines
    with a reviewed 160-line exception to keep both actual category structures
    and the forgetful functor visible. The graph presentability
    Challenge adds 74 lines. All seventeen total 1288 physical lines,
    including comments and blank lines, and together form the review surface.
    New proof/Challenge correspondence was separately
    reviewed by GPT-6.1-Sol/xhigh agents who did not implement those proofs.
    Challenge proof placeholders are outside the proved library. Dependency pins
    and negative-control implementations use v0.1.0 commit
    dce8401a23588ba65b8aa4ca41de26cb0203d444; the Challenges do not import it.
    Comparator cannot establish that the chosen specifications correctly express
    the original manuscript, and no independent human review is claimed.
alignment:
  namespace: "DaggerModels"
  statements:
    - source: "bg.def.dagger-scat"
      lean: "DaggerModels.DaggerSimplicialStructure"
      module: "DaggerModels/DaggerSimplicialCategory.lean"
      status: "definition-and-elementary-lemmas"
      note: "Full mapping-space dagger and actual enriched opposite functors, with independent universes."
    - source: "bg.def.dagger-graph"
      lean: "DaggerModels.DaggerSimplicialGraph"
      module: "DaggerModels/DaggerSimplicialGraph.lean"
      status: "definition-and-elementary-lemmas"
      note: "Actual graph category with arbitrary vertex maps and dagger-compatible SSet edge maps."
    - source: "Free construction at the start of bg.lem.presentable"
      lean: "DaggerModels.exists_freeDaggerSimplicialCategory"
      module: "DaggerModels/FreeDaggerSimplicialCategory.lean"
      status: "proved"
      note: >-
        Concrete finite paths, actual adjunction, singleton-edge unit and full
        universal property. Monadicity and word finitarity are recorded below.
        General colimits, local finite presentability, and bg.lem.creation's
        ordinary-category forgetful assertion remain unproved.
    - source: "Monadicity assertion in bg.lem.presentable"
      lean: "DaggerModels.DaggerSimplicialCat.forgetGraph_monadic"
      module: "DaggerModels/DaggerSimplicialMonadicity.lean"
      status: "proved"
      note: >-
        Actual graph forgetful functor is monadic by isomorphism reflection,
        constructed graph-split quotient categories and coequalizers, and
        Mathlib's Beck theorem. Arbitrary common universe u and all object maps
        are retained. Local finite presentability of dagger simplicial
        categories remains unproved.
    - source: "Graph presentability ingredient in the proof of bg.lem.presentable"
      lean: "DaggerModels.daggerGraphLocallyFinitelyPresentable"
      module: "DaggerModels/DaggerGraphPresentable.lean"
      status: "proved"
      note: >-
        The complete original graph category is equivalent to presheaves on a
        concrete small index. Both functors, natural unit/counit and triangle
        are proved. All small limits/colimits and LFP hold at every common
        value universe u. Word finitarity is recorded separately below;
        dagger-category LFP remains unproved.
    - source: "Word finitarity ingredient in the proof of bg.lem.presentable"
      lean: "DaggerModels.DaggerSimplicialCat.exists_finitary_freeDaggerSimplicialCategoryAdjunction"
      module: "DaggerModels/FreeWordFinitary.lean"
      status: "proved"
      note: >-
        The original free/forgetful composite preserves all small filtered
        colimits, proved using exact finite endpoint pullbacks, their disjoint
        sum, and a natural identification with actual paths. The Challenge
        keeps the original forgetful functor and requires an actual left
        adjoint with this finitarity property. No finitarity premise remains.
        Monadicity also gives all small limits and filtered colimits, created
        over graphs. General colimits and category LFP remain unproved.
    - source: "Index category preceding prop.sSetdag_is_equivalent_to_Fun"
      lean: "DaggerModels.ReverseSimplex"
      module: "DaggerModels/ReverseSimplex.lean"
      status: "definition-and-elementary-lemmas"
    - source: "def.dagger_simplicial_sets"
      lean: "DaggerModels.DaggerSSet"
      module: "DaggerModels/SimplicialSet.lean"
      status: "definition-and-elementary-lemmas"
    - source: "Opening nondegeneracy argument in dj.lem.free-cof"
      lean: "DaggerModels.DaggerSSet.dagger_mem_nonDegenerate_iff"
      module: "DaggerModels/SimplicialSet.lean"
      status: "proved"
      note: "This is a subargument, not the whole cellular characterization."
    - source: "dj.def.free-cof"
      lean: "DaggerModels.DaggerSSet.FreeCofibration"
      module: "DaggerModels/SimplicialSet.lean"
      status: "definition-only"
    - source: "Vertex-level obstruction in dj.prop.counterexample"
      lean: "DaggerModels.WordObstruction.no_dagger_preserving_section"
      module: "DaggerModels/WordObstruction.lean"
      status: "proved"
      note: "This does not prove the full model-categorical counterexample."
    - source: "prop.sSetdag_is_equivalent_to_Fun"
      lean: "DaggerModels.nonempty_daggerSSetEquivalencePresheaf"
      module: "DaggerModels/Presheaf.lean"
      status: "proved"
      note: >-
        The actual equivalence data are constructed. Presentable.lean additionally
        proves all small limits and colimits and local finite presentability,
        hence the source proposition's local presentability clause.
    - source: "Free-forgetful adjunction on simplicial sets in dj.not.adjunctions"
      lean: "DaggerModels.exists_freeDaggerAdjunction"
      module: "DaggerModels/FreeDagger.lean"
      status: "proved"
      note: >-
        Actual adjunction existence. The explicit pushout, swap and unit
        identification are also proved in FreeDaggerPushout.lean and
        FreeDaggerSkeleton.lean.
    - source: "Zero-skeleton common subcomplex in dj.not.adjunctions"
      lean: "DaggerModels.SSetVertices.exists_skeletonIso"
      module: "DaggerModels/Vertices.lean"
      status: "proved"
      note: "The isomorphism preserves inclusion; mathlib skeleton 1 is the manuscript's sk_0."
    - source: "Explicit simplicial-set free-completion pushout in dj.not.adjunctions"
      lean: "DaggerModels.freeDagger_skeleton_pushout"
      module: "DaggerModels/FreeDaggerSkeleton.lean"
      status: "proved"
      note: "Genuine pushout universal property, adjunction unit, natural right leg and both swap equations."
    - source: "Retract closure argument in dj.lem.free-cof"
      lean: "DaggerModels.DaggerSSet.FreeCofibration.of_retract"
      module: "DaggerModels/FreeCofibration.lean"
      status: "proved"
      note: "Retract closure is an ingredient of the full cellular characterization proved separately."
    - source: "Pushout closure argument in dj.lem.free-cof"
      lean: "DaggerModels.DaggerSSet.FreeCofibration.of_isPushout"
      module: "DaggerModels/FreeCofibrationPushout.lean"
      status: "proved"
      note: "Any genuine dagger-category pushout square; no additional monicity assumption on the other leg."
    - source: "Explicit predicate obstruction in pointset.cor.cofibrant-obstruction"
      lean: "DaggerModels.DaggerSSet.exists_freeCofibration_not_normalMono"
      module: "DaggerModels/NormalCofibrationObstruction.lean"
      status: "proved"
      note: "The initial-to-point witness is proved; model cofibrancy and Theorem D are not."
    - source: "Parts (1)-(2) of pointset.prop.weak-counterexample"
      lean: "DaggerModels.UnitaryObstruction.exists_equivalence_not_unitarilyEssentiallySurjective"
      module: "DaggerModels/UnitaryObstruction.lean"
      status: "proved"
      note: "Actual integer dagger groupoid witness; part (3) and Quillen consequences remain unproved."
    - source: "Coproduct and transfinite closure in dj.lem.free-cof"
      lean: "DaggerModels.DaggerSSet.freeCofibrations_saturated"
      module: "DaggerModels/FreeCofibrationClosure.lean"
      status: "proved"
      note: "Closure of the original predicate under all stated saturation operations, at arbitrary u."
    - source: "dj.cor.Fdag-free"
      lean: "DaggerModels.freeDagger_map_freeCofibration"
      module: "DaggerModels/FreeDaggerCofibration.lean"
      status: "proved"
      note: "Every simplicial mono is sent to a free cofibration by any actual free adjunction."
    - source: "Saturation-to-free direction in dj.lem.free-cof"
      lean: "DaggerModels.freeBoundarySaturation_le"
      module: "DaggerModels/FreeBoundary.lean"
      status: "proved"
      note: "The generators are the actual F(boundary n).ι images; the reverse inclusion is proved separately."
    - source: "Relative skeletal filtration and colimit in dj.lem.free-cof"
      lean: "DaggerModels.DaggerSSet.exists_relativeSkeletonFiltration"
      module: "DaggerModels/RelativeSkeleton.lean"
      status: "proved"
      note: "Actual image-plus-skeleton stages with specified inclusions, source map and colimit."
    - source: "Boundary preimage and Eilenberg-Zilber step in dj.lem.free-cof"
      lean: "DaggerModels.RelativeCellBoundary.relative_stage_complement_iff"
      module: "DaggerModels/RelativeCellBoundary.lean"
      status: "proved"
      note: "All degrees including zero; characteristic map is not assumed mono; ancestor and epi are unique."
    - source: "dj.lem.free-cof (cellular characterization)"
      lean: "DaggerModels.freeBoundarySaturation_eq"
      module: "DaggerModels/RelativeCellPresentation.lean"
      status: "proved"
      note: >-
        The stated saturation of the actual free boundary inclusions equals
        the original free-cofibration class, for any actual free adjunction
        and every value universe u. The canonical free functor is a proved
        specialization.
    - source: "dj.lem.free-cof (every free cofibration is a relative cell complex)"
      lean: "DaggerModels.exists_relativeFreeBoundaryCellComplex"
      module: "DaggerModels/RelativeCellPresentation.lean"
      status: "proved"
      note: >-
        Actual RelativeCellComplex data with the original map and target
        colimit, constructed from genuine orbit representatives and attachment
        pushouts. Degree zero attaches individual new vertices. No cellularity
        premise or monicity of characteristic maps is assumed.
    - source: "Main theorems A-D"
      status: "not-formalized"
