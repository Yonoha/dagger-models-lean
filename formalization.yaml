# yaml-language-server: $schema=./.ci/schema/formalization-v0.4.schema.json
version: "v0.4"
project:
  name: "Dagger models in Lean"
  description: >-
    A partial formalization of foundational constructions from Models for dagger
    (infinity,1)-categories I. It constructs the reversal simplex category and
    dagger simplicial sets, proves their presheaf equivalence and presentability,
    constructs the actual free-forgetful adjunction and its zero-skeleton pushout
    presentation with the unit and swap dagger, and proves elementary
    reversal and nondegeneracy lemmas, the vertex-level word obstruction,
    the free-versus-normal cofibration obstruction, and the integer dagger
    groupoid example separating ordinary equivalence from unitary essential
    surjectivity. Free cofibrations are proved closed under identities,
    composition, coproducts, pushouts, continuous transfinite composition, and
    retracts. Every free cofibration is an actual relative free-boundary-cell
    complex, and the saturation of those generators equals the original
    free-cofibration class. The construction uses the genuine relative skeletal
    filtration and colimit, individual new vertices in degree zero, and free
    dagger orbits in positive degrees, at arbitrary value universe.
    It also constructs genuine dagger simplicial categories and graphs, the
    actual finite-path free category, and its free-forgetful adjunction with
    singleton-edge unit and full universal property. The graph forgetful functor
    is monadic by constructed graph-split coequalizers and Beck's theorem.
    The graph category has an actual small-index presheaf equivalence, all small
    limits and colimits, and local finite presentability at every value universe.
    The actual finite-word monad is finitary; all small limits and filtered
    colimits exist for dagger simplicial categories and are created over graphs.
    Hom quotients of free categories on graph colimits construct all small
    colimits. Together with a small strong generator of finitely presentable
    objects, this proves local finite presentability of dagger simplicial categories.
    The ordinary-category forgetful functor creates all small limits and colimits,
    with independent object, hom, and diagram universes.
    Actual two-object free dagger cells have the unrestricted universal property
    and are finitely presentable for finite simplicial sets. Their ordinary
    underlying categories are pushouts of the two directed one-edge cells.
    An actual cofree right adjoint proves ordinary forgetting preserves colimits.
    Actual ordinary colimits discharge both pushout-existence conditions in the
    full successive-attachment reduction. Actual discrete dagger categories,
    the initial-to-point generator, and the two-object cell lifting equivalence
    give the full I-dagger boundary-RLP characterization. Its comparison with
    trivial Kan fibrations remains unproved. The main model-categorical theorems
    A-D are not formalized.
    Ordinary boundary lifting now implies the actual Mathlib Kan fibration
    predicate. Every ordinary simplicial mono has an actual relative boundary-cell
    presentation, yielding equality of boundary RLP and mono RLP. Both conditions
    supply an actual section and cylinder homotopy over the original target.
    A finite-domain small-object bridge gives the actual I-dagger unconditional
    small object argument and functorial factorization in its two lifting classes.
    The ordinary rigidification adjunction uses Mathlib's standard thickening
    and general Yoneda-extension adjunction. Its nerve is naturally isomorphic
    to the actual Mathlib coherent nerve, and its standard-simplex values are
    naturally the standard thickening. The actual thickening reversal and
    opposite mate construct the dagger left/right functors and their adjunction,
    retaining the original Hom correspondence in both directions and the original
    unit/counit. The ordinary-category free dagger adjunction retains original
    objects and the identity object unit. Mathlib's uniqueness of left adjoints
    gives the canonical comparison, preserving both composite units/counits.
    All conclusions of dj.lem.lift are proved; model structures remain unproved.
  authors:
    - "Keima Akasaka (AI-assisted; implementation generated with Codex)"
  responsible_maintainers:
    - "Keima Akasaka"
  license: "Apache-2.0"
sources:
  - title: "Models for dagger (infinity,1)-categories I: Dagger simplicial sets and unitary cores"
    authors: ["Keima Akasaka"]
    type: "article"
    location: >-
      def.dagger_simplicial_sets; the index-category definition before
      prop.sSetdag_is_equivalent_to_Fun; dj.def.free-cof; the opening
      nondegeneracy argument in dj.lem.free-cof; the vertex-level obstruction
      in the proof of dj.prop.counterexample; prop.sSetdag_is_equivalent_to_Fun;
      the simplicial-set free-forgetful adjunction in dj.not.adjunctions;
      the explicit predicate obstruction in pointset.cor.cofibrant-obstruction;
      parts (1)-(2) of pointset.prop.weak-counterexample.
      The explicit zero-skeleton pushout in dj.not.adjunctions and the
      full cellular characterization in dj.lem.free-cof are also formalized,
      together with dj.cor.Fdag-free. Every free cofibration has an actual
      relative presentation by free boundary cells, and the stated saturation
      equality is proved.
      It also formalizes bg.def.dagger-scat, bg.def.dagger-graph, and the free
      word construction with its universal property at the start of
      bg.lem.presentable, and the monadicity assertion of that lemma using
      constructed graph-split coequalizers. The graph-LFP ingredient is proved via
      an actual small-index presheaf equivalence. The actual word monad's
      finitarity is proved by exact finite endpoint pullbacks and their disjoint
      sum, naturally identified with the original free functor. Actual small colimits
      and a small strong generator of finitely presentable objects prove the lemma's
      complete local finite presentability conclusion for dagger simplicial categories.
      The ordinary forgetful creation assertion of bg.lem.creation is also proved.
      The two-object cells in bg.not.cells, their universal property bg.eq.A-univ,
      and its finite compactness assertion are proved. The underlying free-cell
      decomposition, ordinary colimit existence, and colimit preservation prove
      the full successive-attachment comparison in bg.lem.reduction. The actual
      I-dagger in bg.def.IJ, including dimension-zero boundaries and the object
      generator, has the exact object-surjectivity plus hom-boundary-RLP
      characterization used in bg.lem.I-inj. The comparison with trivial Kan
      fibrations is not yet formalized.
      Ordinary boundary-cell presentations, boundary-to-Kan lifting and sections
      with cylinder homotopies supply further inputs toward bg.lem.I-inj.
      The actual local horn family in bg.def.IJ has RLP exactly on local Kan
      fibrations. The actual I-dagger small-object argument and functorial
      factorization implement the corresponding input to bg.thm.main.
      The ordinary rigidification adjunction recalled in dj.not.adjunctions is
      constructed from existing Mathlib results, with the full natural nerve
      comparison and standard-simplex comparison. The category-to-category free
      dagger adjunction in dj.not.adjunctions and the complete dj.lem.lift are
      now constructed. The original ordinary adjunction, both full Hom directions,
      unit/counit, actual free adjunctions and canonical comparison are retained.
      The separate ordinary free-dagger pushout remark is not included.
    relationship: "formalizes"
    author_endorsement: "participated"
    note: >-
      Based on the author's working manuscript inspected on 2026-10-01.
      The author commissioned the project and its public repository.
      This participation does not assert that the author has reviewed the Lean
      statements or independently verified the source-to-Lean correspondence.
related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Uses simplicial sets, opposites, simplex reversal, nondegenerate simplices,
      category equivalences, presentability, Kan extensions, and groupoids.
      The free dagger simplicial-category construction uses actual enriched
      categories and functors, Cartesian SSet tensor, quivers, and finite paths.
      Ordinary rigidification reuses the existing simplicial thickening,
      coherent nerve, restricted Yoneda functor and left Kan extension adjunction.
      The dagger lift reuses the actual mate correspondence and uniqueness of
      left adjoints, including its existing unit and counit compatibility lemmas.
status:
  scope: >-
    Partial formalization toward A-D. Presheaf equivalence and local finite
    presentability are proved at every value universe, as is existence of the
    actual free-forgetful adjunction and its explicit free-completion pushout,
    with the genuine universal property, unit and swap dagger. All stated free
    cofibration closure operations are proved. Every free cofibration has an
    actual relative free-boundary-cell presentation, and the stated saturation
    equals the original class, proving both conclusions of dj.lem.free-cof.
    The actual category of dagger simplicial categories, graph category,
    finite-path free construction, free-forgetful adjunction and singleton
    unit are proved. Monadicity of the graph forgetful functor is proved by
    constructing the actual split quotient enrichment, quotient functor and
    coequalizer universal property, followed by Beck's theorem. The graph category
    is proved equivalent to a concrete small-index presheaf category, with all
    small limits/colimits and local finite presentability at each value universe.
    The actual word monad is finitary, with arbitrary graph maps and common
    value universe. Monadicity creates all small limits and filtered colimits
    over graphs, and those colimits and limits exist, with no remaining
    finitarity premise. General colimits are constructed as actual hom quotients
    of free categories on graph colimits. The free adjunction and accessibility
    give a small strong generator of finitely presentable objects, proving local
    finite presentability without a remaining colimit premise. This completes
    bg.lem.presentable. The different ordinary-category forgetful assertion in
    bg.lem.creation is also proved, with actual creation data, independent
    object, hom, and diagram universes, and no existence premise.
    The actual two-object free dagger cells have the full bg.eq.A-univ property,
    and the same cell is finitely presentable for finite simplicial sets.
    The actual ordinary one-edge cells, their pushout decomposition of the
    underlying free dagger cell, and a right adjoint to ordinary forgetting
    are constructed. Actual ordinary colimits and the two-copy pasting lemma
    complete the full bg.lem.reduction attachment comparison with all three
    comparison-leg equations and no pushout-existence premise. Actual discrete
    dagger categories give the initial empty and terminal identity-only point;
    the same empty-to-point map detects surjectivity of every functor on objects.
    Actual free two-object cell lifting is equivalent to full hom-space lifting.
    Together these prove the exact I-dagger boundary-RLP characterization. The
    trivial Kan fibration comparison and full bg.lem.I-inj remain unproved.
    The actual ordinary boundary RLP implies Mathlib's Kan fibration property.
    Every ordinary mono has an actual relative boundary-cell presentation, and
    the transfinite closure of boundary coproduct attachments is exactly all
    monos. Boundary RLP therefore equals mono RLP. Each such map has one section
    and one cylinder homotopy satisfying both endpoint laws and the equation
    over its original target. The local positive horn generators have RLP exactly
    when every hom map is a Kan fibration. The actual I-dagger admits the small
    object argument and actual functorial factorization, from proved smallness,
    finite presentability of all generator domains and existing small colimits.
    Full simplicial counterexamples, model structures, unitary-core recognition
    and main theorems A-D remain unproved. The
    concrete comparison obstructions do not by themselves establish Theorem D.
    All conclusions of dj.lem.lift are proved for the original rigidification
    adjunction: actual dagger functors, full Hom compatibility in both directions,
    original unit/counit, both actual free adjunctions and the canonical free
    comparison with composite unit/counit laws, at every common universe u.
    The ordinary-category free pushout presentation is a separate open remark.
