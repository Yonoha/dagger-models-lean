name: Linux verification capability probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capabilities:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed probe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Measure native Linux isolation prerequisites
        run: python3 -I -B scripts/probe_linux_verification.py
